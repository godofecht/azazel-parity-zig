name: parity
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  azazel:
    name: azazel builds the Zig tokenizer consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ github.job }}-
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install CUE
        run: |
          curl -sL "https://github.com/cue-lang/cue/releases/download/v0.11.1/cue_v0.11.1_linux_amd64.tar.gz" -o /tmp/cue.tgz
          sudo tar -xzf /tmp/cue.tgz -C /usr/local/bin cue
      - run: ./azazel/fetch.sh
      - name: Build tokenizer consumer via azazel
        working-directory: azazel
        run: |
          sh gen_build_spec.sh
          time zig build
          ./zig-out/bin/consumer
  zaza:
    name: zaza builds the Zig tokenizer consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ github.job }}-
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./zaza/fetch.sh
      - name: Build + run consumer via zaza
        working-directory: zaza
        run: time zig build run
